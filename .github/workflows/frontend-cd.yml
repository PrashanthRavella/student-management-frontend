name: Frontend CD

on:
  workflow_run:
    workflows: [Frontend CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: frontend-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') &&
      vars.AZURE_ACR_NAME != '' &&
      vars.AZURE_FRONTEND_APP_NAME != '' &&
      vars.AZURE_RESOURCE_GROUP != ''
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out verified revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push image
        env:
          ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          test -n "$ACR_NAME"
          az acr login --name "$ACR_NAME"
          docker build --tag "$ACR_NAME.azurecr.io/student-management-web:$IMAGE_TAG" .
          docker push "$ACR_NAME.azurecr.io/student-management-web:$IMAGE_TAG"

      - name: Deploy Container App revision
        env:
          ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
          APP_NAME: ${{ vars.AZURE_FRONTEND_APP_NAME }}
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          test -n "$APP_NAME"
          test -n "$RESOURCE_GROUP"
          az extension add --name containerapp --upgrade --yes
          az containerapp update \
            --name "$APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$ACR_NAME.azurecr.io/student-management-web:$IMAGE_TAG" \
            --revision-suffix "${IMAGE_TAG:0:7}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --output none

      - name: Verify health
        env:
          APP_NAME: ${{ vars.AZURE_FRONTEND_APP_NAME }}
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: |
          fqdn=$(az containerapp show --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" --query properties.configuration.ingress.fqdn --output tsv)
          curl --fail --retry 12 --retry-all-errors --retry-delay 10 "https://$fqdn/health"
